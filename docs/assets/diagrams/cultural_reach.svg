<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1184 190" role="img" aria-labelledby="title desc" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><title id="title">国美文化传播的四种作用</title><desc id="desc">触达、理解、扩散和社会连接可以分别发生，不是必须依次完成的流程。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f37" stroke-width="1.4"/></marker></defs><line x1="0" y1="8" x2="270" y2="8" stroke="#173f37" stroke-width="2"/><text x="0" y="50" font-size="26" fill="#173f37" font-weight="600" text-anchor="start">文化触达</text><text x="0" y="78" font-size="15" fill="#596b61" font-weight="400" text-anchor="start">Reach</text><text x="0" y="118" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">让非美院公众接触作品</text><text x="0" y="160" font-size="16" fill="#596b61" font-weight="400" text-anchor="start">现场发现／线上直接访问</text><line x1="302" y1="8" x2="572" y2="8" stroke="#173f37" stroke-width="2"/><text x="302" y="50" font-size="26" fill="#173f37" font-weight="600" text-anchor="start">文化理解</text><text x="302" y="78" font-size="15" fill="#596b61" font-weight="400" text-anchor="start">Understanding</text><text x="302" y="118" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">了解作品的问题与思考</text><text x="302" y="160" font-size="16" fill="#596b61" font-weight="400" text-anchor="start">创作过程／作者讲述</text><line x1="604" y1="8" x2="874" y2="8" stroke="#173f37" stroke-width="2"/><text x="604" y="50" font-size="26" fill="#173f37" font-weight="600" text-anchor="start">文化扩散</text><text x="604" y="78" font-size="15" fill="#596b61" font-weight="400" text-anchor="start">Circulation</text><text x="604" y="118" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">让内容被分享与再使用</text><text x="604" y="160" font-size="16" fill="#596b61" font-weight="400" text-anchor="start">主题策展／教育引用</text><line x1="906" y1="8" x2="1176" y2="8" stroke="#173f37" stroke-width="2"/><text x="906" y="50" font-size="26" fill="#173f37" font-weight="600" text-anchor="start">社会连接</text><text x="906" y="78" font-size="15" fill="#596b61" font-weight="400" text-anchor="start">Connection</text><text x="906" y="118" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">让艺术进入公共生活</text><text x="906" y="160" font-size="16" fill="#596b61" font-weight="400" text-anchor="start">讨论／文化活动／合作</text></svg>