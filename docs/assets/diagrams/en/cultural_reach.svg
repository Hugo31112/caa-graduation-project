<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1184 190" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" lang="en"><title id="title">Four Contributions to Cultural Communication</title><desc id="desc">Reach, understanding, circulation and social connection can occur independently, without a fixed sequence.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f37" stroke-width="1.4" /></marker></defs><line x1="0" y1="8" x2="270" y2="8" stroke="#173f37" stroke-width="2" /><text x="0" y="50" font-size="26" fill="#173f37" font-weight="600" text-anchor="start">Reach</text><text x="0" y="118" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">Connect the public with art</text><text x="0" y="160" font-size="15.9" fill="#596b61" font-weight="400" text-anchor="start">On-site discovery / online access</text><line x1="302" y1="8" x2="572" y2="8" stroke="#173f37" stroke-width="2" /><text x="302" y="50" font-size="26" fill="#173f37" font-weight="600" text-anchor="start">Understanding</text><text x="302" y="118" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">Explore ideas behind works</text><text x="302" y="160" font-size="15.4" fill="#596b61" font-weight="400" text-anchor="start">Creative process / artist accounts</text><line x1="604" y1="8" x2="874" y2="8" stroke="#173f37" stroke-width="2" /><text x="604" y="50" font-size="26" fill="#173f37" font-weight="600" text-anchor="start">Circulation</text><text x="604" y="118" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">Share and reuse content</text><text x="604" y="160" font-size="16" fill="#596b61" font-weight="400" text-anchor="start">Themed curation / education</text><line x1="906" y1="8" x2="1176" y2="8" stroke="#173f37" stroke-width="2" /><text x="906" y="50" font-size="26" fill="#173f37" font-weight="600" text-anchor="start">Connection</text><text x="906" y="118" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">Bring art into public life</text><text x="906" y="160" font-size="14.6" fill="#596b61" font-weight="400" text-anchor="start">Discussion / events / collaboration</text></svg>