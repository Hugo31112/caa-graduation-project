<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1184 338" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" lang="en"><title id="title">Three Entry Points and Continued Engagement</title><desc id="desc">History, interests and specific searches are parallel routes; saving and returning are optional.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f37" stroke-width="1.4" /></marker></defs><text x="0" y="30" font-size="24" fill="#173f37" font-weight="600" text-anchor="start">History</text><text x="0" y="63" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">Places, inscriptions and history</text><line x1="320" y1="44" x2="440" y2="160" stroke="#173f37" stroke-width="2" marker-end="url(#arrow)" /><text x="0" y="146" font-size="24" fill="#173f37" font-weight="600" text-anchor="start">Interests</text><text x="0" y="179" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">Landscape, life and interests</text><line x1="320" y1="160" x2="440" y2="160" stroke="#173f37" stroke-width="2" marker-end="url(#arrow)" /><text x="0" y="262" font-size="24" fill="#173f37" font-weight="600" text-anchor="start">Specific Works</text><text x="0" y="295" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">Search artist, year or title</text><line x1="320" y1="276" x2="440" y2="160" stroke="#173f37" stroke-width="2" marker-end="url(#arrow)" /><rect x="462" y="100" width="310" height="150" fill="#173f37" stroke="none" stroke-width="1.5" /><text x="488" y="143" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">CAA Online Archive</text><text x="488" y="184" font-size="17.1" fill="#ffffff" font-weight="400" text-anchor="start">Open related works and records</text><text x="488" y="219" font-size="17" fill="#ffffff" font-weight="400" text-anchor="start">Also accessible independently</text><line x1="782" y1="175" x2="870" y2="175" stroke="#173f37" stroke-width="2" marker-end="url(#arrow)" /><text x="900" y="133" font-size="25" fill="#173f37" font-weight="600" text-anchor="start">After the Visit</text><text x="900" y="175" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">Save works and processes</text><text x="900" y="207" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">Explore, share and exchange</text></svg>