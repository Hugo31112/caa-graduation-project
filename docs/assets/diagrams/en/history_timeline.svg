<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1184 210" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" lang="en"><title id="title">Gushan: Founding and Historical Memory</title><desc id="desc">Three documented historical episodes, rather than a complete institutional history.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f37" stroke-width="1.4" /></marker></defs><line x1="35" y1="74" x2="1149" y2="74" stroke="#d8dfd8" stroke-width="2" /><circle cx="34" cy="74" r="6" fill="#173f37" /><text x="25" y="44" font-size="29" fill="#173f37" font-weight="600" text-anchor="start">1928</text><text x="25" y="120" font-size="23" fill="#173f37" font-weight="600" text-anchor="start">Academy Founded</text><text x="25" y="158" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">Established at Luoyuan, Gushan.</text><text x="25" y="187" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">Recorded in institutional histories.</text><circle cx="427" cy="74" r="6" fill="#173f37" /><text x="418" y="44" font-size="29" fill="#173f37" font-weight="600" text-anchor="start">1930s</text><text x="418" y="120" font-size="23" fill="#173f37" font-weight="600" text-anchor="start">Lakeside Campus</text><text x="418" y="158" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">Historic photographs show buildings,</text><text x="418" y="187" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">the gate and outdoor sketching.</text><circle cx="820" cy="74" r="6" fill="#173f37" /><text x="811" y="44" font-size="29" fill="#173f37" font-weight="600" text-anchor="start">2018</text><text x="811" y="120" font-size="23" fill="#173f37" font-weight="600" text-anchor="start">90th-anniversary Visit</text><text x="811" y="158" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">Staff and students return,</text><text x="811" y="187" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">renewing memories of the site.</text></svg>