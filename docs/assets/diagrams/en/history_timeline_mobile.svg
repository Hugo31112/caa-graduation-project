<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 490" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" lang="en"><title id="title">Gushan: Founding and Historical Memory</title><desc id="desc">Gushan: Founding and Historical Memory</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f37" stroke-width="1.4" /></marker></defs><line x1="14" y1="18" x2="14" y2="490" stroke="#d8dfd8" stroke-width="2" /><circle cx="14" cy="31" r="5" fill="#173f37" /><text x="38" y="40" font-size="27" fill="#173f37" font-weight="600" text-anchor="start">1928</text><text x="38" y="78" font-size="21" fill="#173f37" font-weight="600" text-anchor="start">Academy Founded</text><text x="38" y="110" font-size="17" fill="#2d3834" font-weight="400" text-anchor="start">Established at Luoyuan, Gushan.</text><text x="38" y="136" font-size="16.5" fill="#2d3834" font-weight="400" text-anchor="start">Recorded in institutional histories.</text><circle cx="14" cy="191" r="5" fill="#173f37" /><text x="38" y="200" font-size="27" fill="#173f37" font-weight="600" text-anchor="start">1930s</text><text x="38" y="238" font-size="21" fill="#173f37" font-weight="600" text-anchor="start">Lakeside Campus</text><text x="38" y="270" font-size="16.5" fill="#2d3834" font-weight="400" text-anchor="start">Historic photographs show buildings,</text><text x="38" y="296" font-size="17" fill="#2d3834" font-weight="400" text-anchor="start">the gate and outdoor sketching.</text><circle cx="14" cy="351" r="5" fill="#173f37" /><text x="38" y="360" font-size="27" fill="#173f37" font-weight="600" text-anchor="start">2018</text><text x="38" y="398" font-size="21" fill="#173f37" font-weight="600" text-anchor="start">90th-anniversary Visit</text><text x="38" y="430" font-size="17" fill="#2d3834" font-weight="400" text-anchor="start">Staff and students return,</text><text x="38" y="456" font-size="17" fill="#2d3834" font-weight="400" text-anchor="start">renewing memories of the site.</text></svg>