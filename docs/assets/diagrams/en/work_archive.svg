<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1184 230" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" lang="en"><title id="title">Four Layers of a Work's Archive</title><desc id="desc">Records follow available sources and permissions; public responses are separate records.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f37" stroke-width="1.4" /></marker></defs><rect x="0" y="0" width="278" height="230" fill="#f1f5f0" stroke="none" stroke-width="1.5" /><text x="20" y="44" font-size="24" fill="#173f37" font-weight="600" text-anchor="start">Inspiration</text><line x1="20" y1="96" x2="258" y2="96" stroke="#d8dfd8" stroke-width="2" /><text x="20" y="135" font-size="16.6" fill="#2d3834" font-weight="400" text-anchor="start" textLength="246" lengthAdjust="spacingAndGlyphs">Observations and experiences</text><text x="20" y="168" font-size="14.5" fill="#2d3834" font-weight="400" text-anchor="start">References and initial questions</text><rect x="302" y="0" width="278" height="230" fill="#f1f5f0" stroke="none" stroke-width="1.5" /><text x="322" y="44" font-size="24" fill="#173f37" font-weight="600" text-anchor="start">Process</text><line x1="322" y1="96" x2="560" y2="96" stroke="#d8dfd8" stroke-width="2" /><text x="322" y="135" font-size="13.7" fill="#2d3834" font-weight="400" text-anchor="start">Research, sketches, material tests</text><text x="322" y="168" font-size="16.6" fill="#2d3834" font-weight="400" text-anchor="start" textLength="246" lengthAdjust="spacingAndGlyphs">Iterations and key decisions</text><rect x="604" y="0" width="278" height="230" fill="#f1f5f0" stroke="none" stroke-width="1.5" /><text x="624" y="44" font-size="24" fill="#173f37" font-weight="600" text-anchor="start">Outcomes</text><line x1="624" y1="96" x2="862" y2="96" stroke="#d8dfd8" stroke-width="2" /><text x="624" y="135" font-size="15.5" fill="#2d3834" font-weight="400" text-anchor="start">Works, models and moving image</text><text x="624" y="168" font-size="14.1" fill="#2d3834" font-weight="400" text-anchor="start">Artist statements and exhibitions</text><rect x="906" y="0" width="278" height="230" fill="#f1f5f0" stroke="none" stroke-width="1.5" /><text x="926" y="44" font-size="24" fill="#173f37" font-weight="600" text-anchor="start">Responses</text><line x1="926" y1="96" x2="1164" y2="96" stroke="#d8dfd8" stroke-width="2" /><text x="926" y="135" font-size="14.5" fill="#2d3834" font-weight="400" text-anchor="start">Artist updates and visitor views</text><text x="926" y="168" font-size="16.6" fill="#2d3834" font-weight="400" text-anchor="start" textLength="246" lengthAdjust="spacingAndGlyphs">Discussion and participation</text><text x="926" y="208" font-size="14.1" fill="#8d6544" font-weight="400" text-anchor="start">Responses remain separate records</text></svg>