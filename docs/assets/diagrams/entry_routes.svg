<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1184 338" role="img" aria-labelledby="title desc" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><title id="title">三类入口与离场延续</title><desc id="desc">历史、兴趣和指定检索并行进入；收藏与续看自愿选择。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f37" stroke-width="1.4"/></marker></defs><text x="0" y="30" font-size="24" fill="#173f37" font-weight="600" text-anchor="start">历史入口</text><text x="0" y="63" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">真实地点、碑与校史资料</text><line x1="320" y1="44" x2="440" y2="160" stroke="#173f37" stroke-width="2" marker-end="url(#arrow)"/><text x="0" y="146" font-size="24" fill="#173f37" font-weight="600" text-anchor="start">兴趣入口</text><text x="0" y="179" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">景观、生活议题与个人兴趣</text><line x1="320" y1="160" x2="440" y2="160" stroke="#173f37" stroke-width="2" marker-end="url(#arrow)"/><text x="0" y="262" font-size="24" fill="#173f37" font-weight="600" text-anchor="start">指定作品入口</text><text x="0" y="295" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">作者、年份、作品名直接查找</text><line x1="320" y1="276" x2="440" y2="160" stroke="#173f37" stroke-width="2" marker-end="url(#arrow)"/><rect x="462" y="100" width="310" height="150" fill="#173f37" stroke="none" stroke-width="1.5"/><text x="488" y="143" font-size="27" fill="#ffffff" font-weight="600" text-anchor="start">国美线上作品库</text><text x="488" y="184" font-size="18" fill="#ffffff" font-weight="400" text-anchor="start">直接打开相关作品与档案</text><text x="488" y="219" font-size="17" fill="#ffffff" font-weight="400" text-anchor="start">也可独立在线访问</text><line x1="782" y1="175" x2="870" y2="175" stroke="#173f37" stroke-width="2" marker-end="url(#arrow)"/><text x="900" y="133" font-size="25" fill="#173f37" font-weight="600" text-anchor="start">离场延续</text><text x="900" y="175" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">保存具体作品与过程</text><text x="900" y="207" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">继续探索、分享或交流</text></svg>