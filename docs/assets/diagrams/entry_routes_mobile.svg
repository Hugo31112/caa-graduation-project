<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 660" role="img" aria-labelledby="title desc" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><title id="title">三类入口与离场延续</title><desc id="desc">三类入口与离场延续</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f37" stroke-width="1.4"/></marker></defs><line x1="0" y1="2" x2="360" y2="2" stroke="#d8dfd8" stroke-width="2"/><text x="0" y="35" font-size="23" fill="#173f37" font-weight="600" text-anchor="start">历史入口</text><text x="0" y="70" font-size="17" fill="#2d3834" font-weight="400" text-anchor="start">真实地点、碑与校史资料</text><line x1="0" y1="106" x2="360" y2="106" stroke="#d8dfd8" stroke-width="2"/><text x="0" y="139" font-size="23" fill="#173f37" font-weight="600" text-anchor="start">兴趣入口</text><text x="0" y="174" font-size="17" fill="#2d3834" font-weight="400" text-anchor="start">景观、生活议题与个人兴趣</text><line x1="0" y1="210" x2="360" y2="210" stroke="#d8dfd8" stroke-width="2"/><text x="0" y="243" font-size="23" fill="#173f37" font-weight="600" text-anchor="start">指定作品入口</text><text x="0" y="278" font-size="17" fill="#2d3834" font-weight="400" text-anchor="start">作者、年份、作品名直接查找</text><text x="0" y="335" font-size="17" fill="#596b61" font-weight="400" text-anchor="start">三类入口并行，可直接查找</text><rect x="0" y="360" width="360" height="126" fill="#173f37" stroke="none" stroke-width="1.5"/><text x="22" y="400" font-size="25" fill="#ffffff" font-weight="600" text-anchor="start">国美线上作品库</text><text x="22" y="436" font-size="18" fill="#ffffff" font-weight="400" text-anchor="start">直接打开相关档案</text><text x="22" y="467" font-size="16" fill="#ffffff" font-weight="400" text-anchor="start">无需先到孤山，也可独立访问</text><line x1="180" y1="493" x2="180" y2="530" stroke="#173f37" stroke-width="2" marker-end="url(#arrow)"/><text x="0" y="572" font-size="24" fill="#173f37" font-weight="600" text-anchor="start">离场延续</text><text x="0" y="611" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">保存具体作品与过程</text><text x="0" y="640" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">继续探索、分享或交流</text></svg>