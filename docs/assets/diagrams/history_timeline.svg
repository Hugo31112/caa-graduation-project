<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1184 210" role="img" aria-labelledby="title desc" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><title id="title">孤山创校与历史记忆</title><desc id="desc">三个有资料依据的历史片段，不代表完整校史。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f37" stroke-width="1.4"/></marker></defs><line x1="35" y1="74" x2="1149" y2="74" stroke="#d8dfd8" stroke-width="2"/><circle cx="34" cy="74" r="6" fill="#173f37"/><text x="25" y="44" font-size="29" fill="#173f37" font-weight="600" text-anchor="start">1928</text><text x="25" y="120" font-size="23" fill="#173f37" font-weight="600" text-anchor="start">国立艺术院创校</text><text x="25" y="158" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">校址位于孤山罗苑。</text><text x="25" y="187" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">校方与浙大校史均有记载。</text><circle cx="427" cy="74" r="6" fill="#173f37"/><text x="418" y="44" font-size="29" fill="#173f37" font-weight="600" text-anchor="start">1930年代</text><text x="418" y="120" font-size="23" fill="#173f37" font-weight="600" text-anchor="start">临湖校园与教学</text><text x="418" y="158" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">历史照片记录临水建筑、</text><text x="418" y="187" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">校门和学生写生。</text><circle cx="820" cy="74" r="6" fill="#173f37"/><text x="811" y="44" font-size="29" fill="#173f37" font-weight="600" text-anchor="start">2018</text><text x="811" y="120" font-size="23" fill="#173f37" font-weight="600" text-anchor="start">九十周年重访孤山</text><text x="811" y="158" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">师生重访并拍摄合影，</text><text x="811" y="187" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">延续对创校地点的记忆。</text></svg>