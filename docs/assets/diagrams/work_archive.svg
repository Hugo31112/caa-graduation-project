<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1184 230" role="img" aria-labelledby="title desc" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><title id="title">作品的四层档案</title><desc id="desc">每层按真实材料与授权收录；公众回应作为独立记录。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#173f37" stroke-width="1.4"/></marker></defs><rect x="0" y="0" width="278" height="230" fill="#f1f5f0" stroke="none" stroke-width="1.5"/><text x="20" y="44" font-size="24" fill="#173f37" font-weight="600" text-anchor="start">灵感与问题</text><text x="20" y="73" font-size="15" fill="#596b61" font-weight="400" text-anchor="start">Inspiration</text><line x1="20" y1="96" x2="258" y2="96" stroke="#d8dfd8" stroke-width="2"/><text x="20" y="135" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">社会观察、个人经历</text><text x="20" y="168" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">参考资料、最初提问</text><rect x="302" y="0" width="278" height="230" fill="#f1f5f0" stroke="none" stroke-width="1.5"/><text x="322" y="44" font-size="24" fill="#173f37" font-weight="600" text-anchor="start">研究与过程</text><text x="322" y="73" font-size="15" fill="#596b61" font-weight="400" text-anchor="start">Process</text><line x1="322" y1="96" x2="560" y2="96" stroke="#d8dfd8" stroke-width="2"/><text x="322" y="135" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">调研、草图、材料试验</text><text x="322" y="168" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">方案迭代、关键选择</text><rect x="604" y="0" width="278" height="230" fill="#f1f5f0" stroke="none" stroke-width="1.5"/><text x="624" y="44" font-size="24" fill="#173f37" font-weight="600" text-anchor="start">成果与展示</text><text x="624" y="73" font-size="15" fill="#596b61" font-weight="400" text-anchor="start">Outcome</text><line x1="624" y1="96" x2="862" y2="96" stroke="#d8dfd8" stroke-width="2"/><text x="624" y="135" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">最终作品、模型与影像</text><text x="624" y="168" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">作者陈述、展览记录</text><rect x="906" y="0" width="278" height="230" fill="#f1f5f0" stroke="none" stroke-width="1.5"/><text x="926" y="44" font-size="24" fill="#173f37" font-weight="600" text-anchor="start">后续与回应</text><text x="926" y="73" font-size="15" fill="#596b61" font-weight="400" text-anchor="start">Response</text><line x1="926" y1="96" x2="1164" y2="96" stroke="#d8dfd8" stroke-width="2"/><text x="926" y="135" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">作者更新、观众理解</text><text x="926" y="168" font-size="18" fill="#2d3834" font-weight="400" text-anchor="start">讨论、独立参与记录</text><text x="926" y="208" font-size="15" fill="#8d6544" font-weight="400" text-anchor="start">附加记录不覆盖作者原档</text></svg>